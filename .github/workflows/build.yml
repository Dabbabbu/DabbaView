name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]          # v2.6.0 처럼 태그를 올리면 Release까지 만듦
  pull_request:
  workflow_dispatch:

permissions:
  contents: write         # Release 만들기

jobs:
  macos:
    name: macOS (.app, py2app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install py2app Pillow

      - name: Generate icons
        run: python create_icon.py

      - name: Build .app
        run: python setup_app.py py2app

      - name: Smoke test (app starts and stays up)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/DabbaView.app/Contents/MacOS/DabbaView > smoke.log 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "App exited during startup:"; cat smoke.log; exit 1
          fi
          kill "$pid"

      - name: Package
        # ditto keeps the bundle's symlinks and permissions intact
        run: ditto -c -k --keepParent dist/DabbaView.app DabbaView-macOS.zip

      - uses: actions/upload-artifact@v7
        with:
          name: DabbaView-macOS
          path: DabbaView-macOS.zip

  windows:
    name: Windows (.exe, PyInstaller)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build
        shell: cmd
        run: build_windows.bat

      - name: Smoke test (app starts and stays up)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist\DabbaView\DabbaView.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Error "App exited during startup (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\DabbaView -DestinationPath DabbaView-Windows.zip

      - uses: actions/upload-artifact@v7
        with:
          name: DabbaView-Windows
          path: DabbaView-Windows.zip

  release:
    name: Release (태그를 올렸을 때)
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: DabbaView-macOS

      - uses: actions/download-artifact@v7
        with:
          name: DabbaView-Windows

      - name: 파일 이름에 버전 · OS 넣기
        run: |
          mv DabbaView-macOS.zip "DabbaView-$GITHUB_REF_NAME-macOS.zip"
          mv DabbaView-Windows.zip "DabbaView-$GITHUB_REF_NAME-Windows.zip"
          ls -lh DabbaView-*.zip

      - name: Release 본문 (CHANGELOG에서 이 버전 부분만)
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" <<'PY' > notes.md
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(version)}.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          body = (m.group(1).strip() if m else "").strip()
          print(body or f"DabbaView {version}")
          print()
          print("## 내려받기")
          print()
          print("| 운영체제 | 파일 | 설치 |")
          print("|---|---|---|")
          tag = "${{ github.ref_name }}"
          print(f"| macOS | `DabbaView-{tag}-macOS.zip` | 압축을 풀고 `DabbaView.app`을 **응용 프로그램**으로 옮긴 뒤, 처음에는 **우클릭 → 열기** |")
          print(f"| Windows | `DabbaView-{tag}-Windows.zip` | 압축을 풀고 `DabbaView\\DabbaView.exe` 실행. SmartScreen에서 **추가 정보 → 실행** |")
          print()
          print("서명되지 않은 앱이라 처음 열 때 경고가 나옵니다. 전체 변경 이력은 [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).")
          print()
          print("> DabbaView는 진단용으로 인증된 의료기기가 아닙니다. 연구 · 교육용으로 사용하세요.")
          PY

      - name: Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DabbaView $GITHUB_REF_NAME" \
            --notes-file notes.md \
            "DabbaView-$GITHUB_REF_NAME-macOS.zip" "DabbaView-$GITHUB_REF_NAME-Windows.zip"

      - name: 이전 Release 정리 (최신 하나만 남김)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 태그는 남겨 두고 Release(내려받기 파일)만 지움 - 늘 최신 하나만 보이게
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep -vx "$GITHUB_REF_NAME" \
            | while read -r old; do
                echo "이전 Release 삭제: $old"
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes
              done

