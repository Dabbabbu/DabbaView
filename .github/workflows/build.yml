name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]          # v2.6.0 처럼 태그를 올리면 Release까지 만듦
  pull_request:
  workflow_dispatch:

permissions:
  contents: write         # Release 만들기

# main에 올릴 때마다 .app · .exe를 통째로 다시 만들면 한 번에 7~9분이 걸리고,
# 태그까지 같이 올리면 같은 커밋으로 빌드가 둘 떠서 줄을 섭니다.
# 그래서 main 푸시에는 가벼운 점검만 하고, 설치 파일은 '태그를 올릴 때'만 만듭니다.
# (PR과 수동 실행(workflow_dispatch)은 전처럼 전체 빌드를 합니다)

jobs:
  check:
    name: 빠른 점검 (main 푸시)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 문법 검사 (모든 .py)
        run: python -m compileall -q dabbaview run.py setup_app.py

      - name: 버전 표기가 서로 맞는지
        run: |
          python3 - <<'EOF'
          import re, sys, pathlib
          version = re.search(r'__version__ = "(.+?)"',
                              pathlib.Path("dabbaview/__init__.py").read_text(encoding="utf-8")).group(1)
          problems = []
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          if f"**Version** {version}" not in readme:
              problems.append("README.md의 **Version**")
          manual = pathlib.Path("docs/manual.md").read_text(encoding="utf-8")
          if f"버전 {version}" not in manual:
              problems.append("docs/manual.md의 '버전'")
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          if not re.search(rf"^## {re.escape(version)}\b", changelog, re.M):
              problems.append(f"CHANGELOG.md의 '## {version}' 항목")
          if problems:
              print(f"__version__ = {version} 인데 다음이 안 맞습니다:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print(f"버전 {version} — README · 사용설명서 · CHANGELOG 모두 일치")
          EOF

  macos:
    name: macOS (.app, py2app)
    # main 푸시에서는 건너뜀 (태그 · PR · 수동 실행에서만)
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install py2app Pillow

      - name: Generate icons
        run: python create_icon.py

      - name: Build .app
        run: python setup_app.py py2app

      - name: Smoke test (app starts and stays up)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/DabbaView.app/Contents/MacOS/DabbaView > smoke.log 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "App exited during startup:"; cat smoke.log; exit 1
          fi
          kill "$pid"

      - name: Package
        # ditto keeps the bundle's symlinks and permissions intact
        run: ditto -c -k --keepParent dist/DabbaView.app DabbaView-macOS.zip

      - uses: actions/upload-artifact@v7
        with:
          name: DabbaView-macOS
          path: DabbaView-macOS.zip

  windows:
    name: Windows (.exe, PyInstaller)
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build
        shell: cmd
        run: build_windows.bat

      - name: Smoke test (app starts and stays up)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist\DabbaView\DabbaView.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Error "App exited during startup (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\DabbaView -DestinationPath DabbaView-Windows.zip

      - uses: actions/upload-artifact@v7
        with:
          name: DabbaView-Windows
          path: DabbaView-Windows.zip

      # 설치 프로그램: 한 번 설치하면 바탕화면 · 시작 메뉴 바로가기가 생기고, 새 버전도 같은 자리에 덮어써서 업데이트
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = (Select-String -Path dabbaview\__init__.py -Pattern '__version__ = "(.+?)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$v" installer\DabbaView.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist-installer\DabbaView-Setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: DabbaView-Windows-Setup
          path: dist-installer/DabbaView-Setup.exe

  release:
    name: Release (태그를 올렸을 때)
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 태그를 연달아 올리면 Release 작업이 겹쳐서, 먼저 끝난 쪽의 '이전 Release 정리'가
    # 뒤엣것이 만들고 있던 초안을 지워 버렸다 (HTTP 404). 한 번에 하나씩만 돌린다.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: DabbaView-macOS

      - uses: actions/download-artifact@v7
        with:
          name: DabbaView-Windows

      - uses: actions/download-artifact@v7
        with:
          name: DabbaView-Windows-Setup

      - name: 파일 이름에 버전 · OS 넣기
        run: |
          mv DabbaView-macOS.zip "DabbaView-$GITHUB_REF_NAME-macOS.zip"
          mv DabbaView-Windows.zip "DabbaView-$GITHUB_REF_NAME-Windows.zip"
          mv DabbaView-Setup.exe "DabbaView-$GITHUB_REF_NAME-Windows-Setup.exe"
          ls -lh DabbaView-*.zip

      - name: Release 본문 (CHANGELOG에서 이 버전 부분만)
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" <<'PY' > notes.md
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(version)}.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          body = (m.group(1).strip() if m else "").strip()
          print(body or f"DabbaView {version}")
          print()
          print("## 내려받기")
          print()
          print("| 운영체제 | 파일 | 설치 |")
          print("|---|---|---|")
          tag = "${{ github.ref_name }}"
          print(f"| macOS | `DabbaView-{tag}-macOS.zip` | 압축을 풀고 `DabbaView.app`을 **응용 프로그램**으로 옮긴 뒤, 처음에는 **우클릭 → 열기** |")
          print(f"| **Windows (권장)** | `DabbaView-{tag}-Windows-Setup.exe` | 실행해서 설치 → **바탕화면 · 시작 메뉴 바로가기**가 생깁니다. 새 버전도 이 파일을 실행하면 같은 자리에 업데이트되어 바로가기가 그대로 작동. SmartScreen에서 **추가 정보 → 실행** |")
          print(f"| Windows (설치 없이) | `DabbaView-{tag}-Windows.zip` | 압축을 풀고 `DabbaView\\DabbaView.exe` 실행 |")
          print()
          print("서명되지 않은 앱이라 처음 열 때 경고가 나옵니다. 전체 변경 이력은 [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).")
          print()
          print("> DabbaView는 진단용으로 인증된 의료기기가 아닙니다. 연구 · 교육용으로 사용하세요.")
          PY

      - name: Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DabbaView $GITHUB_REF_NAME" \
            --notes-file notes.md \
            "DabbaView-$GITHUB_REF_NAME-macOS.zip" "DabbaView-$GITHUB_REF_NAME-Windows.zip" \
            "DabbaView-$GITHUB_REF_NAME-Windows-Setup.exe"

      - name: 이전 Release 정리 (최신 하나만 남김)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 태그는 남겨 두고 Release(내려받기 파일)만 지움 - 늘 최신 하나만 보이게.
          # '나보다 낮은 버전'만 지운다 - 예전에는 '나 말고 전부'를 지워서,
          # 뒤늦게 끝난 옛 버전이 더 새 Release를 지워 버릴 수 있었다.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' > tags.txt
          cat > prune.py <<'PY'
          import sys
          def key(tag):
              parts = tag.lstrip("v").split(".")
              return tuple(int(p) if p.isdigit() else 0 for p in (parts + ["0", "0", "0"])[:3])
          mine = key(sys.argv[1])
          for line in sys.stdin:
              tag = line.strip()
              if tag and tag != sys.argv[1] and key(tag) < mine:
                  print(tag)
          PY
          python3 prune.py "$GITHUB_REF_NAME" < tags.txt > to_delete.txt
          while read -r old; do
            [ -n "$old" ] || continue
            echo "이전 Release 삭제: $old"
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes || true
          done < to_delete.txt

