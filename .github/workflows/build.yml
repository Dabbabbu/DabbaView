name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (.app, py2app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install py2app Pillow

      - name: Generate icons
        run: python create_icon.py

      - name: Build .app
        run: python setup_app.py py2app

      - name: Smoke test (app starts and stays up)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/RadiantView.app/Contents/MacOS/RadiantView > smoke.log 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "App exited during startup:"; cat smoke.log; exit 1
          fi
          kill "$pid"

      - name: Package
        # ditto keeps the bundle's symlinks and permissions intact
        run: ditto -c -k --keepParent dist/RadiantView.app RadiantView-macOS.zip

      - uses: actions/upload-artifact@v7
        with:
          name: RadiantView-macOS
          path: RadiantView-macOS.zip

  windows:
    name: Windows (.exe, PyInstaller)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build
        shell: cmd
        run: build_windows.bat

      - name: Smoke test (app starts and stays up)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist\RadiantView\RadiantView.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Error "App exited during startup (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\RadiantView -DestinationPath RadiantView-Windows.zip

      - uses: actions/upload-artifact@v7
        with:
          name: RadiantView-Windows
          path: RadiantView-Windows.zip
